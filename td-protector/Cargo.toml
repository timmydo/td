[package]
name = "td-protector"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "td's device-bound disk protector: PCR policies, sealing, unsealing, the PCR 12 release cap, recovery keys and LUKS2 tokens over td-tpm"

[package.metadata.td-gate]
clippy-all-targets = true

[workspace]

[dependencies]
td-json = { path = "../td-json" }
td-luks = { path = "../td-luks" }
td-tpm = { path = "../td-tpm" }

[dev-dependencies]
td-fs = { path = "../td-fs" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

[profile.release]
opt-level = "s"
panic = "abort"
strip = true

# Tests only (`cargo test`; build, check, clippy and release are untouched):
# the crash-cut upgrade test replays every cut through unoptimised byte
# loops. Only `opt-level` is set, so `dev`'s debug and overflow assertions
# stay on.
# A debugger run gets unoptimised locals with
# `cargo test --config profile.test.opt-level=0`.
[profile.test]
opt-level = 2
