[package]
name = "td-profiler"
version = "0.1.0"
edition = "2021"
description = "td's continuous system profiler and offline report generator"
license = "GPL-3.0-or-later"

[workspace]

[[bin]]
name = "td-profiler"
path = "src/main.rs"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

[profile.release]
opt-level = "s"
panic = "abort"
strip = false
