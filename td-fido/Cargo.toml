[package]
name = "td-fido"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "td's dependency-free FIDO2 client: CTAP HID framing, CBOR, the CTAP codecs, PIN protocols, hmac-secret, P-256, AES and root hidraw admission"

[package.metadata.td-gate]
clippy-all-targets = true

[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

[profile.release]
opt-level = "s"
panic = "abort"
strip = true
