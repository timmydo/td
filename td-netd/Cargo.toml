[package]
name = "td-netd"
version = "0.1.0"
edition = "2021"
description = "td's minimal static network bring-up daemon: link-up + DHCP + resolv.conf, a confined single-ioctl surface"
license = "GPL-3.0-or-later"

# Own workspace root. The engine root manifest carries no `exclude` list, and
# never needed one: an `exclude` stops cargo only at that manifest, and this
# crate's lock must never mix into the dependency-free engine lock. From a
# nested checkout (e.g. .claude/worktrees/*,
# which lives physically under the main checkout) cargo would keep walking up and
# be captured by the outer manifest, which lists neither member nor exclude for the
# nested path. An explicit empty `[workspace]` pins THIS as the root and stops the
# walk, so `cargo clippy/test` works identically from the main checkout or a
# worktree — the standalone-build invariant the recipe's direct-rustc build assumes.
[workspace]

[[bin]]
name = "td-netd"
path = "src/main.rs"

# td-netd is a TARGET-built userland program, NOT part of the control-plane engine.
# Like td-kexec it is a standalone crate OUTSIDE the builder/recipes engine
# workspace, so the one-self-entry Cargo.lock gate on those crates (which loops
# only over `builder recipes`) never inspects it. Zero external dependencies (pure
# std). The recipe compiles src/main.rs directly with rustc; this manifest exists
# so the same source is an independently `cargo clippy`/`cargo test`-able crate.

# unsafe is confined in SOURCE, not here: src/main.rs `#![deny(unsafe_code)]`s the
# whole crate and scopes a `#[allow]` to `syscall3` — the raw ioctl wrapper. This
# is the SECOND target-side unsafe surface after td-kexec (a recorded AGENTS.md
# amendment). Compiler-enforced, so an `unsafe` added anywhere else reds the build;
# no crate-wide allow to override it.

[lints.clippy]
unwrap_used = "deny"       # no panicking .unwrap(); return Result/Option, use ?
expect_used = "deny"       # no panicking .expect()
panic = "deny"             # no panic! on the happy/error path
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"  # use .get(i) over xs[i] / &xs[a..b]

# The SHIPPED td-netd is built by recipes/src/recipes/td-netd.rs invoking rustc
# DIRECTLY (never `cargo build`), and that recipe mirrors opt-level=s / panic=abort
# / strip explicitly. This profile therefore governs only local `cargo build
# --release`; lto is intentionally dropped because a single-crate direct rustc
# build cannot mirror it (it is a cargo-only, cross-crate step), so declaring it
# here would be a contract the shipped artifact silently ignores.
[profile.release]
opt-level = "s"
panic = "abort"
strip = true
