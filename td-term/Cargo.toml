[package]
name = "td-term"
version = "0.1.0"
edition = "2021"
description = "td's terminal: a Wayland window over a PTY, running td-ui's terminal model, renderer and keyboard encoder, with scrollback, a pointer selection and the clipboard; dependency-free Rust over td's shared UI toolkit"
license = "GPL-3.0-or-later"

# Own workspace root, so cargo behaves the same from the main checkout as from
# a worktree nested under it (see the root Cargo.toml). The toolkit is the one
# dependency, a sibling path in the one spelling the lock guard admits
# (AGENTS.md 'Rust code').
[workspace]

[dependencies]
td-ui = { path = "../td-ui" }

[package.metadata.td-gate]
clippy-all-targets = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
