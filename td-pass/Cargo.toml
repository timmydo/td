[package]
name = "td-pass"
version = "0.1.0"
edition = "2021"
description = "td's two-pane encrypted notebook for passwords and recovery notes"
license = "GPL-3.0-or-later"

# A nested worktree's cargo would otherwise be captured by the outer
# checkout's manifest; an empty workspace pins this crate as its root.
[workspace]

[package.metadata.td-gate]
clippy-all-targets = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

# The window draws through td-ui; the vault, its tokens and the host's
# protection are td-secret's notebook library, its `pass` module.
[dependencies]
td-ui = { path = "../td-ui" }
td-secret = { path = "../td-secret" }
