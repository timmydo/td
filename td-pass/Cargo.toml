[package]
name = "td-pass"
version = "0.1.0"
edition = "2021"
description = "td's two-pane encrypted notebook for passwords and recovery notes"
license = "MIT"

# A nested worktree's cargo would otherwise be captured by the outer
# checkout's manifest; an empty workspace pins this crate as its root.
[workspace]

# The native compositor cases' synthetic vault (src/backend/fixture.rs).
# No recipe enables it, and nothing does by default.
[features]
test-vault = []

[package.metadata.td-gate]
clippy-all-targets = true
native-compositor-tests = true
native-compositor-fixture-feature = "test-vault"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

# The window draws through td-ui; the vault, its tokens and the host's
# protection are td-secret's notebook library, its `pass` module.
[dependencies]
td-ui = { path = "../td-ui" }
td-secret = { path = "../td-secret" }
