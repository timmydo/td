[package]
name = "td-install-qemu-test"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Native PID-1 fixture for disposable QEMU installation tests"

[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

[profile.release]
opt-level = "s"
panic = "abort"
