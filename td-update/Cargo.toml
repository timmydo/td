[package]
name = "td-update"
version = "0.1.0"
edition = "2021"
description = "Persistent release source checkout and native system build preparation"
license = "GPL-3.0-or-later"

[package.metadata.td-gate]
clippy-all-targets = true
test-args = "--include-ignored"
gate-test-args = "--bins"

[[bin]]
name = "td-update"
path = "src/main.rs"

[workspace]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

[profile.release]
opt-level = "s"
panic = "abort"
strip = true
