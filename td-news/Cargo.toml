[package]
name = "td-news"
version = "0.1.0"
edition = "2021"
description = "Timmy's News: an RSS and Atom reader in a td-ui window, td's news application"
license = "MIT"

[[bin]]
name = "td-news"
path = "src/main.rs"

# td-news is a TARGET-built application, NOT part of td's control-plane engine
# workspace. It is standalone — its own workspace root — with a lock that
# names itself and the td siblings it draws through. Its closure is `std`
# and td's own crates (td's AGENTS.md "std, not no_std", and APPLICATIONS.md
# §W.8): what ten crates used to supply is those crates, the XML reader
# under `src/`, and one unix socket to td's fetch service.
#
# From a nested checkout (a worktree that lives physically under another
# checkout) cargo walks past this manifest and is captured by the OUTER
# manifest, which lists the nested path as neither member nor exclude. An
# explicit empty `[workspace]` pins THIS as the root and stops the walk, so
# `cargo clippy/test` behave identically from any checkout (mirrors td-sh).
[workspace]

[lints.clippy]
unwrap_used = "deny"       # no panicking .unwrap(); return Result/Option, use ?
expect_used = "deny"       # no panicking .expect()
panic = "deny"             # no panic! on the happy/error path
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"  # use .get(i) over xs[i] / &xs[a..b]

# td's own crates, by the one sibling-dependency spelling the lock guard
# admits (AGENTS.md 'Rust code'): dates and the local zone, the fetch
# service's client, HTML rendering, JSON for the cache and the CLI, the
# cache's key/value store, TOML for the configuration, and the shared UI
# toolkit, through which alone the window, the lists and the read-only
# editor pane an article is read in reach this crate.
[dependencies]
td-civil = { path = "../td-civil" }
td-fetch-client = { path = "../td-fetch-client" }
td-html = { path = "../td-html" }
td-json = { path = "../td-json" }
td-kv = { path = "../td-kv" }
td-toml = { path = "../td-toml" }
td-ui = { path = "../td-ui" }
