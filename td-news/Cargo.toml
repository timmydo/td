[package]
name = "tn"
version = "0.1.0"
edition = "2021"
description = "Timmy's News: a terminal RSS and Atom reader, td's news application"
license = "MIT"

# The SHIPPED reader is this one bin, compiled directly by rustc from td's
# recipe (never `cargo build`) into a static executable.
[[bin]]
name = "tn"
path = "src/main.rs"

# tn is a TARGET-built application, NOT part of td's control-plane engine
# workspace. It is standalone — its own workspace root — with its own
# one-self-entry lock. No dependencies, and staying that way: tn is `std`
# alone (td's AGENTS.md "std, not no_std", and APPLICATIONS.md §W.8). What
# ten crates used to supply is now seven shared td modules under `src/`,
# copied whole and never edited, plus one unix socket to td's fetch service.
#
# From a nested checkout (a worktree that lives physically under another
# checkout) cargo walks past this manifest and is captured by the OUTER
# manifest, which lists the nested path as neither member nor exclude. An
# explicit empty `[workspace]` pins THIS as the root and stops the walk, so
# `cargo clippy/test` behave identically from any checkout (mirrors td-sh).
[workspace]

[lints.clippy]
unwrap_used = "deny"       # no panicking .unwrap(); return Result/Option, use ?
expect_used = "deny"       # no panicking .expect()
panic = "deny"             # no panic! on the happy/error path
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"  # use .get(i) over xs[i] / &xs[a..b]

# The shipped tn is built by td's recipe invoking rustc DIRECTLY with
# +crt-static; that recipe restates opt-level=s / panic=abort / strip. This
# profile governs only local `cargo build --release`. lto is not set: a
# single-crate direct rustc build cannot mirror it, so declaring it here
# would be a contract the artifact ignores.
[profile.release]
opt-level = "s"
panic = "abort"
strip = true
