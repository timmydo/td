[package]
name = "td-mta"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bounded personal mail service using the local td-crypto boundary"

# Independent service library and foundations-only executable.
[workspace]

[package.metadata.td-gate]
clippy-all-targets = true

[dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["io-util"] }
tokio-postgres = { version = "=0.7.18", default-features = false }
td-civil = { path = "../td-civil" }
td-crypto = { path = "../td-crypto" }
td-header = { path = "../td-header" }
td-html = { path = "../td-html" }
td-json = { path = "../td-json" }
td-mime = { path = "../td-mime" }
td-nfc = { path = "../td-nfc" }

[dev-dependencies]
td-fs = { path = "../td-fs" }

[[test]]
name = "rust_alloc_probe"
harness = false

[[test]]
name = "native_alloc_probe"
harness = false

[[test]]
name = "rss_probe"
harness = false

[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(td_native_alloc_probe)"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
