[Unit]
Requires=td-mta-maint-mail-frontend.service td-mta-maint-mail-receive.service td-mta-maint-mail-relay.service td-mta-maint-mail-migadu.service
After=td-mta-maint-mail-frontend.service td-mta-maint-mail-receive.service td-mta-maint-mail-relay.service td-mta-maint-mail-migadu.service

[Service]
ExecStart=
ExecStart=/usr/bin/systemctl --quiet is-active td-mta-postgres.service
ExecStart=/usr/bin/systemctl --quiet is-active td-mta-frontend.service
ExecStart=/usr/bin/systemctl --quiet is-active td-mta-receive.service
ExecStart=/usr/bin/systemctl --quiet is-active td-mta-relay.service
ExecStart=/usr/bin/systemctl --quiet is-active td-mta-acme-production.service
ExecStart=/usr/bin/openssl x509 -in /var/lib/td-mta/mail/tls/server.pem -checkend 2592000 -noout
ExecStart=/usr/bin/openssl x509 -in /var/lib/td-mta/mail/tls/ca.pem -checkend 2592000 -noout
ExecStart=/usr/bin/systemctl --quiet is-active td-mta-maint-backup.timer
ExecStart=/opt/td-mta/bin/td-mta acme-status --connection-file /var/lib/td-mta/mail/runtime-connection --certificate-profile production --require-ready --minimum-validity-seconds 2592000
ExecStart=/opt/td-mta/bin/td-mta-backup-host install-td-mta --backup-status --destination /var/lib/td-mta/backups/scheduled --maximum-age-seconds 172800
ExecStart=/usr/bin/systemctl --quiet is-active td-mta-migadu.service
