# Reviewed differences between production's td-mta configuration and the
# defaults of the release it runs. `td-mta/deploy --converge-config`
# applies this file as the live release's revision has it
# (PRODUCTION.md, "Converge the configuration"); the grammar is
# POSTGRES.md, "Configuration convergence command".
#
# Only resource stanzas labelled with a profile name belong here, with
# the reason for each value beside it, for example:
#
#   [limits "frontend"]
#   # Why the default does not serve this host.
#   event_streams = 6
#
# Host names, addresses, accounts and keys never do: they stay in the
# selected configuration and in the operator's target.json and host.json.
#
# There is no difference today: every profile takes every default.
