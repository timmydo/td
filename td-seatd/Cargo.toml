[package]
name = "td-seatd"
version = "0.1.0"
edition = "2021"
description = "Single-user framebuffer and evdev seat assignment for td"
license = "GPL-3.0-or-later"

# How builder/src/affected.rs gates this crate; absent keys take the defaults.
[package.metadata.td-gate]
clippy-all-targets = true

[[bin]]
name = "td-seatd"
path = "src/main.rs"

[workspace]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

[profile.release]
opt-level = "s"
panic = "abort"
strip = true
