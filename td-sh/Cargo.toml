[package]
name = "td-sh"
version = "0.1.0"
edition = "2021"
description = "td's target-built POSIX /bin/sh (busybox-sh replacement): interpreter + Oils-spec conformance harness"
license = "GPL-3.0-or-later"

# The SHIPPED shell is the `td-sh` bin (src/main.rs), compiled directly by rustc
# from recipes/src/recipes/td-sh.rs (never `cargo build`) into a static ET_EXEC.
[[bin]]
name = "td-sh"
path = "src/main.rs"

# HOST-SIDE conformance tooling, like the lib below and not like the shell: the
# Oils corpus asks what a word expanded to (`argv.py`) and what reached the
# environment (`printenv.py`), and vendors neither here. This is a MULTICALL
# serving both, chosen by argv[0] and staged into `run_case`'s PATH under each
# name in `SPEC_HELPERS`. It cannot reach the image: the recipe compiles
# `src/main.rs` plus a NAMED module list with a direct `rustc`, so a second
# `[[bin]]` is invisible to it.
[[bin]]
name = "spec_helpers"
path = "src/bin/spec_helpers.rs"

# The `td_sh` lib is host-side CONFORMANCE TOOLING only: a zero-dependency reader
# for the Oils (`oils-for-unix`) spec-test format plus a golden-resolver/runner.
# It is NOT compiled into the shipped binary (the recipe builds src/main.rs alone).
# tests/conformance.rs drives the seed spec corpus through the built `td-sh` bin.
[lib]
name = "td_sh"
path = "src/lib.rs"

# td-sh is a TARGET-built program, NOT part of the control-plane engine workspace.
# It is standalone — its own workspace root — with its own one-self-entry lock, so
# the engine's 3-package lock gate never inspects it. Zero external dependencies
# (pure std) — a POSIX sh is a thin layer over exactly the OS services std wraps,
# and std is the pinned toolchain, not a cargo dep (AGENTS.md "std, not no_std").
#
# The engine root carries no `exclude` list and never needed one: an `exclude`
# stops cargo only at THAT manifest.
# From a nested checkout (.claude/worktrees/* lives physically under the main
# checkout) cargo walks past this repo's root manifest and is captured by the OUTER
# manifest, which lists the nested path as neither member nor exclude. An explicit
# empty `[workspace]` pins THIS as the root and stops the walk, so `cargo
# clippy/test` behave identically from the main checkout or a worktree (mirrors
# td-kexec/td-netd).
[workspace]

[lints.clippy]
unwrap_used = "deny"       # no panicking .unwrap(); return Result/Option, use ?
expect_used = "deny"       # no panicking .expect()
panic = "deny"             # no panic! on the happy/error path
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"  # use .get(i) over xs[i] / &xs[a..b]

# The shipped td-sh is built by recipes/src/recipes/td-sh.rs invoking rustc
# DIRECTLY with +crt-static (mirroring td-kexec); that recipe restates
# opt-level=s / panic=abort / strip. This profile governs only local
# `cargo build --release`. lto is dropped: a single-crate direct rustc build
# cannot mirror it, so declaring it here would be a contract the artifact ignores.
[profile.release]
opt-level = "s"
panic = "abort"
strip = true
