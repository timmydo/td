[package]
name = "td-mixer"
version = "0.1.0"
edition = "2021"
description = "td's sound panel: the output that plays, its level, and each application's level, over td-audio's socket; dependency-free Rust over td's shared UI toolkit and Pulse client"
license = "MIT"

# Own workspace root, so cargo behaves the same from the main checkout as from
# a worktree nested under it (see the root Cargo.toml). Its dependencies are
# td's allocation helpers, Pulse client and toolkit, sibling paths in the one
# spelling the lock guard admits (AGENTS.md 'Rust code').
[workspace]

[dependencies]
td-alloc = { path = "../td-alloc" }
td-pulse = { path = "../td-pulse" }
td-ui = { path = "../td-ui" }

[package.metadata.td-gate]
clippy-all-targets = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
