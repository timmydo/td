[package]
name = "tmc"
version = "0.1.0"
edition = "2021"
description = "td's terminal JMAP mail client: mailbox/thread reading, triage rules, retention, spam scoring, and an NDJSON CLI"
license = "MIT"
# `tests/mock_jmap.rs` and `tests/mock_fetch.rs` are helper modules of the one
# integration test, not test binaries of their own: the first includes
# `src/json.rs`, whose `#[macro_export]` macros may appear once per crate.
autotests = false

[[bin]]
name = "tmc"
path = "src/main.rs"

[[test]]
name = "cli_integration"
path = "tests/cli_integration.rs"

# tmc is a TARGET-built application, NOT part of the control-plane engine
# workspace. It is standalone — its own workspace root — with its own
# one-self-entry lock. Zero external dependencies: `std` plus td's shared
# modules, and std is the pinned toolchain rather than a cargo dep (AGENTS.md
# "std, not no_std").
#
# From a nested checkout (.claude/worktrees/* lives physically under the main
# checkout) cargo walks past this repo's root manifest and is captured by the
# OUTER manifest, which lists the nested path as neither member nor exclude. An
# explicit empty `[workspace]` pins THIS as the root and stops the walk, so
# `cargo clippy/test` behave identically from the main checkout or a worktree
# (mirrors td-sh/td-kexec/td-netd).
[workspace]

[lints.clippy]
unwrap_used = "deny"       # no panicking .unwrap(); return Result/Option, use ?
expect_used = "deny"       # no panicking .expect()
panic = "deny"             # no panic! on the happy/error path
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"  # use .get(i) over xs[i] / &xs[a..b]

# The shipped tmc is built by its recipe invoking rustc DIRECTLY, and that
# recipe restates opt-level=s / panic=abort / strip. This profile governs only
# local `cargo build --release`. lto is dropped: a single-crate direct rustc
# build cannot mirror it, so declaring it here would be a contract the artifact
# ignores.
[profile.release]
opt-level = "s"
panic = "abort"
strip = true
