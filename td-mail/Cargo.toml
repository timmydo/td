[package]
name = "td-mail"
version = "0.1.0"
edition = "2021"
description = "td's JMAP mail client in a td-ui window: mailbox/thread reading, triage rules, retention, spam scoring, and an NDJSON CLI"
license = "MIT"
# `tests/mock_jmap.rs` and `tests/mock_fetch.rs` are helper modules of the one
# integration test, not test binaries of their own.
autotests = false

[[bin]]
name = "td-mail"
path = "src/main.rs"

[[test]]
name = "cli_integration"
path = "tests/cli_integration.rs"

# The window under the real headless td-compositor, driven by its seat
# (`ready`'s native tier runs it; see the metadata below).
[[test]]
name = "control_process"
path = "tests/control_process.rs"

[package.metadata.td-gate]
# td-mail is a live Wayland client; its native case launches it offline
# under the real headless td-compositor (tests/control_process.rs). This
# opt-in builds that binary for the gate and adds it as a test-only reader
# dependency.
native-compositor-tests = true

# td-mail is a TARGET-built application, NOT part of the control-plane engine
# workspace. It is standalone — its own workspace root — with a lock that
# names itself and the td siblings it draws through. No external
# dependencies (AGENTS.md principle 2): `std` and td's own crates, and std is
# the pinned toolchain rather than a cargo dep (AGENTS.md "std, not no_std").
#
# From a nested checkout (.claude/worktrees/* lives physically under the main
# checkout) cargo walks past this repo's root manifest and is captured by the
# OUTER manifest, which lists the nested path as neither member nor exclude. An
# explicit empty `[workspace]` pins THIS as the root and stops the walk, so
# `cargo clippy/test` behave identically from the main checkout or a worktree
# (mirrors td-sh/td-kexec/td-netd).
[workspace]

[lints.clippy]
unwrap_used = "deny"       # no panicking .unwrap(); return Result/Option, use ?
expect_used = "deny"       # no panicking .expect()
panic = "deny"             # no panic! on the happy/error path
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"  # use .get(i) over xs[i] / &xs[a..b]

# td's own crates, by the one sibling-dependency spelling the lock guard
# admits (AGENTS.md 'Rust code'): dates and the local zone, base64 for
# the HTTP Basic credential, the fetch service's client, HTML rendering,
# JSON for JMAP and the CLI, the cache's key/value store, td-txt's regex
# engine for the rules, TOML for the configuration and rules files, and
# the shared UI toolkit, through which alone the widget window the client
# draws in and the editor pane it reads and composes a message in reach
# this crate.
[dependencies]
td-civil = { path = "../td-civil" }
td-encoding = { path = "../td-encoding" }
td-fetch-client = { path = "../td-fetch-client" }
td-fs = { path = "../td-fs" }
td-html = { path = "../td-html" }
td-json = { path = "../td-json" }
td-kv = { path = "../td-kv" }
td-regex = { path = "../td-regex" }
td-toml = { path = "../td-toml" }
td-ui = { path = "../td-ui" }
