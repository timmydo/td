[package]
name = "td-vm"
version = "0.1.0"
edition = "2021"
default-run = "td-vm"
description = "Host VM manager and Git enrollment services for td development"
license = "GPL-3.0-or-later"

# How builder/src/affected.rs gates this crate; absent keys take the defaults.
# Lifecycle and integration tests need host QEMU, Git and trusted-root fixtures.
[package.metadata.td-gate]
clippy-all-targets = true
test-args = "--include-ignored"
# ... but the in-sandbox gate runs only the binary targets: the ignored tests
# the host preflight opts into need an environment the guix-free loop has not.
gate-test-args = "--bins"

# Own workspace root, so cargo behaves the same from the main checkout as from a
# worktree nested under it.
[workspace]

[[bin]]
name = "td-vm"
path = "src/bin/td-vm.rs"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

[profile.release]
opt-level = 2
strip = true
