[package]
name = "td-crypto"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "td-owned cryptography and TLS boundary"

[workspace]

[package.metadata.td-gate]
clippy-all-targets = true

# rustls is the TLS engine; td-tls-provider supplies every primitive it asks
# for, from td-primitives, and `custom-provider` keeps rustls from choosing a
# built-in backend of its own.
[dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["custom-provider", "std", "tls12"] }
td-primitives = { path = "../td-primitives" }
td-tls-provider = { path = "../td-tls-provider" }
webpki-roots = "=1.0.11"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
