[package]
name = "td-crypto"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "td-owned cryptography and TLS boundary"

[workspace]

[package.metadata.td-gate]
clippy-all-targets = true

[dependencies]
aws-lc-rs = { version = "=1.18.1", default-features = false, features = ["alloc", "non-fips"] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
webpki-roots = "=1.0.8"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
