[package]
name = "td-crypto"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "td-owned cryptography and TLS boundary"

[workspace]

[package.metadata.td-gate]
clippy-all-targets = true

[dependencies]
aws-lc-rs = { version = "=1.19.0", default-features = false, features = ["alloc", "non-fips"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
webpki-roots = "=1.0.11"

# The td-primitives backend, qualified against AWS-LC in tests only
# (td-mta/IMPLEMENTATION.md F04): no selector, and no normal edge.
[dev-dependencies]
td-primitives = { path = "../td-primitives" }
td-tls-provider = { path = "../td-tls-provider" }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
