[package]
name = "td-html"
version = "0.1.0"
edition = "2021"
description = "td's HTML to text renderer for mail and feed bodies, plain or with tagged spans"
license = "MIT"

# Own workspace root, so cargo behaves the same from the main checkout as from
# a worktree nested under it (see the root Cargo.toml). A consumer names this
# crate as `td-html = { path = "../td-html" }`, the one sibling-dependency
# spelling the lock guard admits (AGENTS.md 'Rust code'). The document
# parser owns fallible storage through td-alloc; the renderer remains separate.
[workspace]

[package.metadata.td-gate]
clippy-all-targets = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

[dependencies]
td-alloc = { path = "../td-alloc" }
