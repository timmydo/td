[package]
name = "td-dom"
version = "0.1.0"
edition = "2021"
description = "td's immutable HTML document adapter for CSS matching"
license = "MIT"
[workspace]
[dependencies]
td-html = { path = "../td-html" }
td-css = { path = "../td-css" }
[package.metadata.td-gate]
clippy-all-targets = true
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
