[package]
name = "td-sandbox"
version = "0.1.0"
edition = "2021"
description = "Persistent private-home development sandboxes over td-jail"
license = "MIT"

[workspace]

[dependencies]
td-fs = { path = "../td-fs" }
td-ui = { path = "../td-ui" }

[package.metadata.td-gate]
clippy-all-targets = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
