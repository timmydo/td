[package]
name = "td-sandbox"
version = "0.1.0"
edition = "2021"
description = "Development sandboxes, each run as its own account by root's workspace intake"
license = "MIT"

[workspace]

[dependencies]
td-alloc = { path = "../td-alloc" }
td-fs = { path = "../td-fs" }
td-ui = { path = "../td-ui" }

[package.metadata.td-gate]
clippy-all-targets = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
