[package]
name = "td-fat"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "td's bounded FAT32 code for its own ESP: admission, reading, reclaim, staging and the one-sector commits of the selector update"

[package.metadata.td-gate]
clippy-all-targets = true

[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

[profile.release]
opt-level = "s"
panic = "abort"
strip = true
