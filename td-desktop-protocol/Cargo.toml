[package]
name = "td-desktop-protocol"
version = "0.1.0"
edition = "2021"
description = "Bounded ordinary desktop messages for td's native viewer and compositor"
license = "MIT"

[workspace]

[package.metadata.td-gate]
clippy-all-targets = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
