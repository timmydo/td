[package]
name = "td-svc"
version = "0.1.0"
edition = "2021"
description = "Static dependency-free service supervisor for td (ordering, backoff, log capture, shutdown)"
license = "GPL-3.0-or-later"

# How builder/src/affected.rs gates this crate; absent keys take the defaults.
[package.metadata.td-gate]
clippy-all-targets = true

[[bin]]
name = "td-svc"
path = "src/main.rs"

# The engine root carries no `exclude` list and never needed one: an `exclude`
# stops cargo only at THAT manifest.
# From a nested checkout (`.claude/worktrees/*` lives physically under the main
# checkout) cargo walks past this repo's root manifest and is captured by the OUTER
# manifest. An explicit empty `[workspace]` pins THIS as the root and stops the
# walk, and is what actually makes this crate standalone — a root `exclude` entry
# only keeps the root's inventory honest. Same reason td-sh/td-util/td-init/
# td-login carry one.
[workspace]

# td-svc is a TARGET-built userland program, NOT part of the control-plane
# engine: a standalone crate with zero external dependencies (pure std), so the
# engine's one-workspace-lock gate never inspects it. The recipe compiles
# src/main.rs directly with rustc; this manifest exists so the same source is an
# independently `cargo clippy`/`cargo test`-able crate.
#
# Like td-init/td-login/td-netd/td-kexec, this crate is an unsafe exception —
# the fifth, and the narrowest: src/main.rs `#![deny(unsafe_code)]`s and ONE
# scoped allow, on src/sys.rs's `syscall2`, carries exactly `kill(2)`.
# DESIGN.md I1 states that surface and I2 states why `pre_exec` stays banned
# even though it needs no `unsafe` of ours — a pre-exec closure runs between
# fork and exec in a multithreaded process, where an allocation or a lock held
# elsewhere at fork time deadlocks the child.
[lints.clippy]
unwrap_used = "deny"       # no panicking .unwrap(); return Result/Option, use ?
expect_used = "deny"       # no panicking .expect()
panic = "deny"             # no panic! on the happy/error path
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"  # use .get(i) over xs[i] / &xs[a..b]

# The SHIPPED td-svc is built by recipes/src/recipes/td-svc.rs invoking rustc
# DIRECTLY (never `cargo build`), and that recipe mirrors opt-level=s /
# panic=abort / strip explicitly. This profile therefore governs only local
# `cargo build --release`; lto is intentionally dropped because a single-crate
# direct rustc build cannot mirror it (a cargo-only, cross-crate step), so
# declaring it here would be a contract the shipped artifact silently ignores.
[profile.release]
opt-level = "s"
panic = "abort"
strip = true
