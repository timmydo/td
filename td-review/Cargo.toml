[package]
name = "td-review"
version = "0.1.0"
edition = "2021"
default-run = "td-review"
description = "The integrator's window: review branches against main, land them, push to every remote"
license = "GPL-3.0-or-later"

# How builder/src/affected.rs gates this crate; absent keys take the defaults.
# The App-level tests drive a real git repo and are `#[ignore]`d so the
# git-less sandbox gate stays honest — this preflight is their only tier.
[package.metadata.td-gate]
clippy-all-targets = true
test-args = "--include-ignored"
# ... but the in-sandbox gate runs only the binary targets: the ignored tests
# the host preflight opts into need an environment the guix-free loop has not.
gate-test-args = "--bins"

# Own workspace root, so cargo behaves the same from the main checkout as from a
# worktree nested under it.
[workspace]

[[bin]]
name = "td-review"
path = "src/main.rs"

# The toolkit the window draws with, by the one sibling-dependency spelling
# the lock guard admits (AGENTS.md 'Rust code'): the lock lists this crate
# and td-ui and nothing else.
[dependencies]
td-ui = { path = "../td-ui" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

[profile.release]
opt-level = 2
strip = true
