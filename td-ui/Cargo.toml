[package]
name = "td-ui"
version = "0.1.0"
edition = "2021"
description = "td's dependency-free UI toolkit: the shared Unifont face and Wayland wire codec, XKB keyboard translation, held-key repeat and pointer decoding, the clipped XRGB raster with its palette and scrollbar geometry, the Wayland client connection over its own descriptor transport and the client over it, and the driving layer (frame and envelope codecs, private control-socket publication, the bounded request worker, the replay runner and the semantic seam: a controller over a consumer's action table, generic verbs, text read back from the draw stream and the painted frame) an agent or a test operates a consumer through, for td-owned graphical programs"
license = "GPL-3.0-or-later"

# Own workspace root, so cargo behaves the same from the main checkout as from
# a worktree nested under it (see the root Cargo.toml). A consumer names this
# crate as `td-ui = { path = "../td-ui" }`, the one sibling-dependency spelling
# the lock guard admits (AGENTS.md 'Rust code'); this crate itself depends on
# nothing, and its confinement tests pin that.
[workspace]

[package.metadata.td-gate]
clippy-all-targets = true
# The control socket's tests bind under 0700 fixtures whose ancestry must
# be caller- or root-owned; inside the gate's namespace the host root is an
# unmapped owner, so the capped runner's private root is requested here.
trusted-test-root = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
