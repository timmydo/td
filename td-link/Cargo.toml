[package]
name = "td-link"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "td's GCC-free Rust link driver: rustc's gcc-style link line onto rust-lld, td glibc and gcc-runtime"

[package.metadata.td-gate]
clippy-all-targets = true

[workspace]

[dev-dependencies]
td-fs = { path = "../td-fs" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

[profile.release]
opt-level = "s"
panic = "abort"
