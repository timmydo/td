[package]
name = "td-photo"
version = "0.1.0"
edition = "2021"
description = "td's photo tool: imports a card of Nikon raw files into dated rolls, culls them from the camera's embedded previews, develops the keepers with exposure, a crop and a look, and exports them; dependency-free Rust over td's shared UI toolkit"
license = "GPL-3.0-or-later"

# Own workspace root, so cargo behaves the same from the main checkout as from
# a worktree nested under it (see the root Cargo.toml). The window increment
# adds the toolkit as a sibling path dependency in the one spelling the lock
# guard admits (AGENTS.md 'Rust code'); until then this crate depends on
# nothing, and its confinement tests pin that. The builder's reader graph
# takes any whole-word `td-*` crate name outside a comment in this manifest,
# the description included, as a read of that crate, so nothing here names
# the toolkit's crate until the dependency exists.
[workspace]

[package.metadata.td-gate]
clippy-all-targets = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
