[package]
name = "td-photo"
version = "0.1.0"
edition = "2021"
description = "td's photo tool: imports a card of Nikon raw files into dated rolls, culls them from the camera's embedded previews, develops the keepers with exposure, a crop and a look, and exports them; dependency-free Rust over td's shared UI toolkit"
license = "GPL-3.0-or-later"

# Own workspace root, so cargo behaves the same from the main checkout as from
# a worktree nested under it (see the root Cargo.toml). The toolkit is the one
# dependency, a sibling path in the one spelling the lock guard admits
# (AGENTS.md 'Rust code'); the confinement tests pin that it is the only one.
[workspace]

[dependencies]
td-ui = { path = "../td-ui" }

[package.metadata.td-gate]
clippy-all-targets = true
# The native case binds the window's control socket under the harness's
# directory in /tmp, and td-ui's socket refuses an ancestor the gate's
# rootless namespace shows as owned by no one; the gate's cargo-test runs
# then take the builder's caller-owned sticky root, as td-editor's do.
trusted-test-root = true
# The window is a live Wayland client; its native case launches it under the
# real headless td-compositor (tests/control_process.rs). This opt-in builds
# that binary for the gate and adds it as a test-only reader dependency.
native-compositor-tests = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
