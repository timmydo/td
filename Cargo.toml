# Control-plane engine workspace: the two host-built td programs (td-builder,
# td-recipe-eval) and the std-only library they share (td-engine). One virtual
# root so the shared JSON + SHA-256 code lives in exactly one place and the two
# bins pull it as a path dependency — no third diverged copy.
#
# The other crates in this repo stay OUT of the workspace and build standalone.
# There is no `exclude` list: each of them carries its own empty `[workspace]`
# table, which is what actually pins it as its own root and stops cargo's upward
# walk from a nested checkout (.claude/worktrees/* lives physically under the
# main checkout). An `exclude` here only stops cargo at THIS manifest, so the
# list was redundant — `td-portal` and `td-login` were never in it and always
# built correctly. Removing it also removes a line every agent adding a crate
# would have edited at once (APPLICATIONS.md §V.0).
#
# Each standalone crate states its own reason for being outside the workspace in
# its own manifest, which is where a reader adding one will be. Two that are not
# obvious from a crate name:
#   net/       — the network tools (td-net); the ONLY crates allowed external
#                deps (ureq/rustls/sha2/ring), so their vendored closure must
#                not mix into the engine's dependency-free lock. It is
#                deliberately NOT `td-`-prefixed: that prefix is what
#                builder/src/affected.rs discovers as a dependency-free crate.
#   td-review/ — a HOST-side integrator utility (branch review + squash landing
#                TUI). In neither bootstrap graph: it is not a control-plane
#                build program and never enters a closure.

[workspace]
resolver = "2"
# Keep this array on ONE line: builder/src/affected.rs reads it to derive the
# workspace lock's expected package count, and refuses a members list that
# does not close on its own line rather than guessing at a count.
members = ["builder", "recipes", "engine"]

[profile.release]
# Keep the release profile explicit and minimal so the reproducibility oracle
# has a stable target as the binaries grow. Profiles are only honoured at the
# workspace root (member [profile.*] sections are ignored), so this is the one
# place it can live for td-builder and td-recipe-eval.

# td-builder and td-engine are optimized under the TEST profile. td-builder's
# xz and bzip2 decoders are exercised on real release tarballs
# (`xz::tests::decodes_real_release_tarballs` decodes a Linux tarball to some
# 800 MiB), and an unoptimized decoder made those two tests the whole wall
# clock of the workspace suite: 152 s and 43 s here, against 25 s and 4 s with
# td-builder at opt-level 2, and 18 s and 4 s once td-engine — whose crc32 and
# sha256 the xz decoder calls; bzip2 carries its own table — is optimized as
# well; the next-longest test takes 14 s. Test only: `cargo test` alone reads
# this, and `cargo build`, `check`, `clippy` and every release build are
# untouched. These two packages only: the recipes crate has no such loop and
# stays unoptimized itself, linking the one optimized engine unit. Only
# `opt-level` is set, so the profile keeps `dev`'s debug assertions, overflow
# checks and incremental builds — the tests are unchanged, only faster. A cold
# test build costs some seventeen seconds more, an incremental one no more, and
# neither package's non-test units share artifacts with `cargo build` any
# longer. A debugger session wants unoptimized locals; one run gets them with
# `cargo test --config profile.test.package.td-builder.opt-level=0`.
[profile.test.package.td-builder]
opt-level = 2
[profile.test.package.td-engine]
opt-level = 2
