[package]
name = "td-disks"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Consented per-machine extra volumes for td, mounted at boot"

[workspace]

[package.metadata.td-gate]
clippy-all-targets = true

[dependencies]
td-btrfs = { path = "../td-btrfs" }
td-fs = { path = "../td-fs" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

[profile.release]
opt-level = "s"
panic = "abort"
