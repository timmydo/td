[package]
name = "td-web"
version = "0.1.0"
edition = "2021"
description = "td's own document browser: HTML, text, PNG, JPEG, GIF, WebP and AVIF through td's fetch service in a td-ui window"
license = "MIT"

[package.metadata.td-gate]
clippy-all-targets = true
# The native cases launch the window under the real headless td-compositor
# at the outputs its pages were measured at (tests/control_process.rs).
native-compositor-tests = true
# They bind the window's control socket under the harness's directory in
# /tmp, which td-ui's binder refuses where the gate's namespace shows an
# ancestor as owned by no one; the gate's test runs take the builder's
# caller-owned root instead, as td-photo's and td-taskmgr's do.
trusted-test-root = true

[[bin]]
name = "td-web"
path = "src/main.rs"

# td-web is a TARGET-built application (td-web/DESIGN.md), standalone like
# td-news: its own workspace root, so cargo behaves the same from any
# checkout, with a lock that names itself and the td siblings it draws
# through.
[workspace]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

# td's own crates, by the one sibling-dependency spelling the lock guard
# admits (AGENTS.md 'Rust code'): the fetch service's client, the HTML
# document tree, CSS and layout, legacy text encodings, the PNG, JPEG,
# GIF, WebP and AVIF decoders, the shared UI toolkit and URLs.
[dependencies]
td-alloc = { path = "../td-alloc" }
td-avif = { path = "../td-avif" }
td-charset = { path = "../td-charset" }
td-css = { path = "../td-css" }
td-fetch-client = { path = "../td-fetch-client" }
td-gif = { path = "../td-gif" }
td-html = { path = "../td-html" }
td-jpeg = { path = "../td-jpeg" }
td-layout = { path = "../td-layout" }
td-png = { path = "../td-png" }
td-ui = { path = "../td-ui" }
td-url = { path = "../td-url" }
td-webp = { path = "../td-webp" }

# Test scratch, owned by td-fs's TempDir guard (AGENTS.md "Parallel work"),
# and the native cases' headless compositor harness.
[dev-dependencies]
td-fs = { path = "../td-fs" }
td-test-compositor = { path = "../td-test-compositor" }
