[package]
name = "td-dua"
version = "0.1.0"
edition = "2021"
description = "td's disk usage analyzer: a directory tree sorted by size over a treemap, with a delete list; dependency-free Rust over td's shared UI toolkit"
license = "MIT"

# Own workspace root, so cargo behaves the same from the main checkout as from
# a worktree nested under it (see the root Cargo.toml). Its dependencies are
# td's civil calendar and the toolkit, sibling paths in the one spelling the
# lock guard admits (AGENTS.md 'Rust code').
[workspace]

[dependencies]
td-civil = { path = "../td-civil" }
td-ui = { path = "../td-ui" }

[package.metadata.td-gate]
clippy-all-targets = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
