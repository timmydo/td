[package]
name = "td-page"
version = "0.1.0"
edition = "2021"
description = "A styled page made, laid out and painted: td-html, td-css and td-layout over td-ui's faces and raster, for td's browser and mail client"
license = "MIT"

[package.metadata.td-gate]
clippy-all-targets = true

[lib]
doctest = false

# A standalone roster crate, its own workspace root, with a lock that
# names itself and the td siblings it draws through.
[workspace]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

# td's own crates, by the one sibling-dependency spelling the lock guard
# admits (AGENTS.md 'Rust code'): the HTML document tree, CSS and layout,
# legacy text encodings, the shared UI toolkit's faces and raster, and
# URLs.
[dependencies]
td-alloc = { path = "../td-alloc" }
td-charset = { path = "../td-charset" }
td-css = { path = "../td-css" }
td-html = { path = "../td-html" }
td-layout = { path = "../td-layout" }
td-ui = { path = "../td-ui" }
td-url = { path = "../td-url" }
