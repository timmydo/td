[package]
name = "td-source-scan"
version = "0.1.0"
edition = "2021"
description = "td's dependency-free source-text scans for confinement tests: comment stripping, unsafe block and allow counts, module coverage"
license = "MIT"

# Own workspace root, so cargo behaves the same from the main checkout as from
# a worktree nested under it (see the root Cargo.toml). A consumer names this
# crate under a bare [dev-dependencies] as
# `td-source-scan = { path = "../td-source-scan" }`, the one sibling spelling
# the lock guard admits (AGENTS.md 'Rust code'); no recipe stages it and no
# shipped binary links it. It depends on nothing but `std`.
[workspace]

[lib]
# Doctests link with the host `cc`, which the gate sandbox does not have.
doctest = false

[package.metadata.td-gate]
clippy-all-targets = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
