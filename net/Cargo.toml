[package]
name = "td-net"
version = "0.1.0"
edition = "2021"
license = "MIT"

# The engine root carries no `exclude` list and never needed one: an `exclude`
# stops cargo only at THAT manifest.
# From a nested checkout (`.claude/worktrees/*` lives physically under the main
# checkout) cargo walks past this repo's root manifest and is captured by the OUTER
# manifest. An explicit empty `[workspace]` pins THIS as the root and stops the
# walk — without it the host-prep warm's `cargo build` in net/ fails from a
# worktree. Same reason td-sh carries one.
[workspace]

# One multicall (busybox-style) binary for td's OWN network tools: the former
# fetch/ (td-fetch), feed/ (td-feed), and subst/ (td-subst) crates. argv[0]'s
# basename selects the applet, so the td-fetch/td-feed/td-subst links dispatch
# with the caller's argv unchanged (src/main.rs).
[[bin]]
name = "td-net"
path = "src/main.rs"

[dependencies]
# Union of the three former crates' deps. ureq + sha2 are shared by all three;
# ring signs for td-subst and td-deploy (ed25519) and mints td-test-https's
# P-256 test identities. ureq 3 no longer re-exports rustls: td-test-https
# serves with it directly and fetchd checks custom roots with it, under the
# features ureq's `rustls` feature already turns on (ring, never aws-lc-rs).
# webpki-roots is the trust store ureq's `RootCerts::WebPki` reads; the exact
# pin is the reviewed store. ureq is pinned exactly too: fetchd implements its
# `unversioned` resolver trait, which ureq may change in a minor release.
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
rustls = { version = "0.23.46", default-features = false, features = ["logging", "ring", "std", "tls12"] }
sha2 = "0.11"
webpki-roots = "=1.0.11"
ring = "0.17"
td-engine = { path = "../engine" }

# Rust coding rules (AGENTS.md → "Rust code"). This is a NETWORK tool — the only
# tier allowed dependencies (the vendored-through-the-cargo-proxy FSDG set above);
# adding a NEW dep is a reviewed decision. The panic/indexing rules still apply;
# the merged applets carry a crate-level `#![allow(...)]` grandfather header in
# src/main.rs. (The cargo-test gate's clippy leg lints only the dependency-free
# engine crates offline; these fire under a local `cargo clippy`.)
[lints.rust]
unsafe_code = "forbid"     # no unsafe in the network tools

[lints.clippy]
unwrap_used = "deny"       # no panicking .unwrap(); return Result/Option, use ?
expect_used = "deny"       # no panicking .expect()
panic = "deny"             # no panic! on the happy/error path
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"  # use .get(i) over xs[i] / &xs[a..b]

[profile.release]
strip = true
