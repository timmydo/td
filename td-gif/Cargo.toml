[package]
name = "td-gif"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bounded first-frame GIF decoder"

[workspace]

[package.metadata.td-gate]
clippy-all-targets = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

[dependencies]
td-alloc = { path = "../td-alloc" }
