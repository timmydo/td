[package]
name = "td-luks"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "td's LUKS2 volume tool: the bounded reader of the one LUKS2 profile td formats, growing into td's cryptsetup replacement"

[package.metadata.td-gate]
clippy-all-targets = true

# The program lives outside src/, which td-boot and td-install stage file
# by file for the library they compile.
[[bin]]
name = "td-luks"
path = "bin/main.rs"

[workspace]

[dependencies]
td-fido = { path = "../td-fido" }
td-json = { path = "../td-json" }

[dev-dependencies]
td-fs = { path = "../td-fs" }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

[profile.release]
opt-level = 3
panic = "abort"
strip = true

# Tests only (`cargo test`; build, check, clippy and release are untouched):
# the software AES-XTS, AF merge and 16 MiB wipes are byte loops the debug
# build runs ~15x slower. Only `opt-level` is set, so `dev`'s debug and
# overflow assertions stay on.
# A debugger run gets unoptimised locals with
# `cargo test --config profile.test.opt-level=0`.
[profile.test]
opt-level = 2
