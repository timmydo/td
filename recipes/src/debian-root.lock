# recipes/src/debian-root.lock — the Debian build root (BUILD-ROOT-PLAN.md).
#
# A pinned Debian image layer plus the .debs unpacked over it form the
# sandbox root recipes compile C in. Nothing from it ships: it is a build
# environment, marked so no ordinary recipe input can name its pins.
#
# Edit the input lines below, then run
#   td-feed debian-root resolve recipes/src/debian-root.lock
# and review the diff. The resolver rewrites only the lines below its
# `# resolved` marker. `td-recipe-eval build-root-pins` lists the `layer`
# and `deb` rows, which `td-feed warm build-root` caches in ~/.td/sources.
# A re-resolve drops the `tree` row; after rebuilding td-builder, run
#   td-builder build-root pin ~/.td/sources recipes/src/debian-root.lock WORK
# to write the assembled tree's NAR hash back, which assembly then requires.
#
# `want` is the C build tool set: the kernel needs gcc, make, flex, bison,
# bc, pkgconf and libelf-dev; rsync serves `make headers_install`, which
# no recipe runs yet; cryptsetup's json-c needs cmake; gcc-runtime builds
# GCC itself, which is C++, so it needs g++; glibc's build needs gawk
# (Debian's awk is mawk) and python3; td-crypto's host-only portable kit
# (td-crypto/PORTABLE.md) cross-compiles AWS-LC's C for aarch64 with
# gcc-aarch64-linux-gnu and binutils-aarch64-linux-gnu; the rest serve the
# C packages and the C inside Rust crates.
