[package]
name = "td-fs"
version = "0.1.0"
edition = "2021"
description = "td's dependency-free file helpers, starting with the real, bounded regular-file read"
license = "MIT"

# Own workspace root, so cargo behaves the same from the main checkout as from
# a worktree nested under it (see the root Cargo.toml). A consumer names this
# crate as `td-fs = { path = "../td-fs" }`, the one sibling-dependency
# spelling the lock guard admits (AGENTS.md 'Rust code'); a crate a recipe
# compiles with a direct rustc includes src/lib.rs by `#[path]` instead. This
# crate depends on nothing but `std`.
[workspace]

[package.metadata.td-gate]
clippy-all-targets = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
