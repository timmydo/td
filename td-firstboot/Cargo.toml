[package]
name = "td-firstboot"
version = "0.1.0"
edition = "2021"
description = "Provisions td's per-machine identity into /var on first boot (machine-id, SSH host key, authorized_keys)"
license = "GPL-3.0-or-later"

[[bin]]
name = "td-firstboot"
path = "src/main.rs"

# The engine root `exclude`s td-firstboot, but that only stops cargo at THAT
# manifest. From a nested checkout (`.claude/worktrees/*` lives physically under
# the main checkout) cargo walks past the excluding root and is captured by the
# OUTER manifest. An explicit empty `[workspace]` pins THIS as the root and stops
# the walk. Same reason td-util/td-sh carry one.
[workspace]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

# lto is deliberately absent: the shipped artifact is a single-crate direct
# `rustc` build (see recipes/src/recipes/td-firstboot.rs), which cannot mirror it,
# so declaring it here would be a contract the artifact ignores. The recipe
# restates opt-level/panic/strip on its own command line.
[profile.release]
opt-level = "s"
panic = "abort"
strip = true
