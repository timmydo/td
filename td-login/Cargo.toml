[package]
name = "td-login"
version = "0.1.0"
edition = "2021"
description = "Static dependency-free multicall for td's credential switch (login, su)"
license = "GPL-3.0-or-later"

[[bin]]
name = "td-login"
path = "src/main.rs"

# The engine root `exclude`s td-login, but that only stops cargo at THAT manifest.
# From a nested checkout (`.claude/worktrees/*` lives physically under the main
# checkout) cargo walks past the excluding root and is captured by the OUTER
# manifest. An explicit empty `[workspace]` pins THIS as the root and stops the
# walk. Same reason td-sh/td-util/td-init carry one.
[workspace]

# td-login is a TARGET-built userland program, NOT part of the control-plane
# engine: a standalone crate with zero external dependencies (pure std), so the
# engine's one-workspace-lock gate never inspects it. The recipe compiles
# src/main.rs directly with rustc; this manifest exists so the same source is an
# independently `cargo clippy`/`cargo test`-able crate.
#
# unsafe is confined in SOURCE, not here: src/main.rs `#![deny(unsafe_code)]`s the
# whole crate and src/sys.rs scopes a `#[allow]` to `syscall2` — the one raw
# syscall body, through which setgroups/setgid/setuid go. This is the FOURTH
# target-side unsafe surface (a recorded AGENTS.md amendment) and the narrowest:
# three syscalls, one call site each, in one function. THREAT-MODEL.md §2 states
# why they are not `CommandExt::uid()`. The `deny` reds an added `unsafe`, but a
# module can demote that lint without using `unsafe` at all, so `main.rs`'s
# confinement tests are the real enforcement: they pin the syscall roster, the
# ORDER of the three call sites, the one asm body, and the lint's own level.

[lints.clippy]
unwrap_used = "deny"       # no panicking .unwrap(); return Result/Option, use ?
expect_used = "deny"       # no panicking .expect()
panic = "deny"             # no panic! on the happy/error path
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"  # use .get(i) over xs[i] / &xs[a..b]

# The SHIPPED td-login is built by recipes/src/recipes/td-login.rs invoking rustc
# DIRECTLY (never `cargo build`), and that recipe mirrors opt-level=s /
# panic=abort / strip explicitly. This profile therefore governs only local
# `cargo build --release`; lto is intentionally dropped because a single-crate
# direct rustc build cannot mirror it (a cargo-only, cross-crate step), so
# declaring it here would be a contract the shipped artifact silently ignores.
[profile.release]
opt-level = "s"
panic = "abort"
strip = true
