[package]
name = "td-cc"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Native C/C++ compiler defaults for td's source-built toolchain"

[workspace]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

[profile.release]
opt-level = "s"
panic = "abort"
