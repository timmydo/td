[package]
name = "td-authd"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "td secure-attention authority"
autotests = false

[package.metadata.td-gate]
clippy-all-targets = true

# Host-only disposable VM fixture, compiled and tested by cargo test.
[[example]]
name = "terminal-launch-vm"
path = "tests/launch_vm.rs"
test = true

[workspace]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

[profile.release]
opt-level = "s"
panic = "abort"
