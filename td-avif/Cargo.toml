[package]
name = "td-avif"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bounded AVIF still-picture decoder"

[workspace]

[dependencies]
td-alloc = { path = "../td-alloc" }
td-av1 = { path = "../td-av1" }

[package.metadata.td-gate]
clippy-all-targets = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
