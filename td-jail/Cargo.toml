[package]
name = "td-jail"
version = "0.1.0"
edition = "2021"
description = "td's application namespace and confinement boundary"
license = "MIT"

# How builder/src/affected.rs gates this crate; absent keys take the defaults.
[package.metadata.td-gate]
clippy-all-targets = true

# The source-pinning tests strip comments through td-source-scan.
# Dev-only: the recipe compiles src/main.rs with a direct rustc and no
# `--test`, so the shipped binary never sees it.
[dev-dependencies]
td-source-scan = { path = "../td-source-scan" }

[workspace]

[[bin]]
name = "td-jail"
path = "src/main.rs"

[features]
target-recipe = []

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

[profile.release]
opt-level = "s"
panic = "abort"
strip = true
