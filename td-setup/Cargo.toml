[package]
name = "td-setup"
version = "0.1.0"
edition = "2021"
description = "The offline graphical installer front end: the installation wizard's pages, rendered over the shared td-ui toolkit"
license = "MIT"

# Own workspace root, so cargo behaves the same from the main checkout as from
# a worktree nested under it (see the root Cargo.toml).
[workspace]

# The pure td-install plan library and the shared UI toolkit use the one
# sibling-dependency spelling the lock guard admits (AGENTS.md 'Rust code').
# The raster, chrome bands and client reach this crate only through `td_ui::`.
# The disk protector's recovery-key codec checks the key the completion page
# shows and the one typed back; only its `recovery` module is named.
[dependencies]
td-install = { path = "../td-install" }
td-protector = { path = "../td-protector" }
td-ui = { path = "../td-ui" }

[package.metadata.td-gate]
clippy-all-targets = true
# The installer is a live Wayland client; its one native case launches it
# under the real headless td-compositor (tests/control_process.rs). This opt-in
# builds that binary for the gate and adds it as a test-only reader dependency.
native-compositor-tests = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
