[package]
name = "td-editor"
version = "0.1.0"
edition = "2021"
description = "A dependency-free text editor: document model and headless replay"
license = "GPL-3.0-or-later"

[workspace]

# The shared UI toolkit, by the one sibling-dependency spelling the lock
# guard admits (AGENTS.md 'Rust code'): its input layer, and the font and
# wire codecs it mounts, reach this crate only through `td_ui::`.
[dependencies]
td-ui = { path = "../td-ui" }

[features]
test-file-barrier = []

[package.metadata.td-gate]
clippy-all-targets = true
trusted-test-root = true
native-compositor-tests = true
native-compositor-fixture-feature = "test-file-barrier"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
