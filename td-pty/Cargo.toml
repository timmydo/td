[package]
name = "td-pty"
version = "0.1.0"
edition = "2021"
description = "td's dependency-free PTY: the confined /dev/ptmx device, a child leading a session on its slave, the reader, writer and waiter threads with their bounded keyboard queue, and the foreground terminal relay"
license = "MIT"

# Own workspace root, so cargo behaves the same from the main checkout as from
# a worktree nested under it (see the root Cargo.toml). A consumer names this
# crate as `td-pty = { path = "../td-pty" }`, the one sibling-dependency
# spelling the lock guard admits (AGENTS.md 'Rust code'). It depends on
# nothing but `std`, so a program that runs a child on a terminal (td-term,
# td-sandbox) or a test that needs a real one (td-init, td-sh) does not
# stage the UI toolkit for it. Its confinement tests pin that.
[workspace]

[package.metadata.td-gate]
clippy-all-targets = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
