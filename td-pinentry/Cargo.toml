[package]
name = "td-pinentry"
version = "0.1.0"
edition = "2021"
description = "A td-ui window answering gpg-agent's pinentry protocol and the askpass convention of ssh and git on a foreign Wayland desktop"
license = "MIT"

# Own workspace root, so cargo behaves the same from the main checkout as from
# a worktree nested under it. The toolkit is the one dependency, a sibling
# path in the one spelling the lock guard admits (AGENTS.md 'Rust code').
[workspace]

[dependencies]
td-ui = { path = "../td-ui" }

[package.metadata.td-gate]
clippy-all-targets = true
native-compositor-tests = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

[dev-dependencies]
td-test-compositor = { path = "../td-test-compositor" }
