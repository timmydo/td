[package]
name = "td-boot"
version = "0.1.0"
edition = "2021"
description = "td's verified deployment selector and kexec boot shim"
license = "GPL-3.0-or-later"

# Own workspace root. The engine root manifest lists this crate in `exclude` (so
# its lock never mixes into the dependency-free engine lock), but that exclude only
# stops cargo at that manifest — from a nested checkout (e.g. .claude/worktrees/*,
# which lives physically under the main checkout) cargo would keep walking up and
# be captured by the outer manifest, which lists neither member nor exclude for the
# nested path. An explicit empty `[workspace]` pins THIS as the root and stops the
# walk, so `cargo clippy/test` works identically from the main checkout or a
# worktree — the standalone-build invariant the recipe's direct-rustc build assumes.
[workspace]

[[bin]]
name = "td-boot"
path = "src/main.rs"

# td-boot is a TARGET-built guest program outside the control-plane workspace.
# It has zero external dependencies. The target recipe compiles this source and
# the shared engine SHA-256 implementation directly with rustc.

# Pin THIS as the workspace root so `cargo` stops here instead of walking up into
# the outer engine manifest from a nested `.claude/worktrees/*` checkout (mirrors
# td-kexec/td-netd/td-sh; without it `cargo test --manifest-path td-boot/Cargo.toml`
# fails from a worktree).
[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

[profile.release]
opt-level = 2
panic = "abort"
strip = true
