[package]
name = "td-passkeys"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Device-bound website passkeys for the td-pass notebook"

[workspace]

[package.metadata.td-gate]
clippy-all-targets = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

[dependencies]
td-alloc = { path = "../td-alloc" }
td-fido = { path = "../td-fido" }
td-fs = { path = "../td-fs" }
td-primitives = { path = "../td-primitives" }
td-protector = { path = "../td-protector" }
td-tpm = { path = "../td-tpm" }
